<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>iindigo.ph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Login -->
  <main class="enter hidden" id="v-login">
    <form id="login-form">
      <div class="logo" style="margin-bottom:2rem">iindigo.ph</div>
      <div class="access">
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button class="btn" type="submit">Log in</button>
      </div>
      <p class="error hidden" id="login-error"></p>
    </form>
  </main>

  <!-- Dashboard + album views -->
  <div class="shell hidden" id="v-app">
    <aside class="side">
      <a class="logo" href="#/">iindigo.ph</a>
      <a class="item active" href="#/">Collections</a>
      <button class="item" id="btn-logout">Log out</button>
    </aside>

    <main class="main">
      <div id="v-list">
        <div class="main-head">
          <h1>Collections</h1>
          <button class="btn" id="btn-new">New Collection</button>
        </div>
        <form class="panel hidden" id="new-form">
          <div class="field"><label for="new-title">Title</label><input id="new-title" required maxlength="200" placeholder="Collection name"></div>
          <button class="btn" type="submit">Create</button>
        </form>
        <p class="error hidden" id="list-error"></p>
        <div class="cards" id="cards"></div>
        <p class="empty hidden" id="list-empty">No collections yet.</p>
      </div>

      <div class="hidden" id="v-album">
        <a class="back" href="#/">&larr; Collections</a>
        <div class="main-head">
          <h1 id="a-title"></h1>
          <div class="tools">
            <button class="btn ghost" id="a-rename">Rename</button>
            <button class="btn ghost" id="a-add">Add photos</button>
            <button class="btn ghost danger" id="a-delete">Delete</button>
          </div>
        </div>
        <input id="a-files" type="file" accept="image/png,image/jpeg" multiple class="hidden">

        <div class="share">
          <span class="share-label">Client link</span>
          <input id="a-link" readonly>
          <button class="btn ghost small" id="a-copy">Copy</button>
          <button class="btn ghost small" id="a-newlink">New link</button>
        </div>

        <div class="progress hidden" id="a-progress"><div id="a-bar"></div></div>
        <p class="error hidden" id="a-error"></p>

        <div class="dropzone" id="a-drop">Drop PNG or JPEG photos here, or click to browse</div>
        <p class="hint hidden" id="a-hint">Drag photos to change the order.</p>
        <div class="photos" id="a-photos"></div>
      </div>
    </main>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
