<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photographer — Atelier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">Atelier<span>.</span></a>
    <nav class="nav"><a href="index.html">Home</a><a href="admin.html" class="active">Photographer</a></nav>
  </header>

  <main class="panel">
    <p class="eyebrow">Studio</p>
    <h1 style="font-size:3rem;margin:.5rem 0">New client gallery</h1>
    <hr class="rule">

    <form id="upload-form">
      <div class="field"><label for="title">Gallery title</label><input id="title" required placeholder="Emma &amp; James — Wedding"></div>
      <div class="field"><label for="client">Client email</label><input id="client" type="email" placeholder="client@example.com"></div>

      <div class="dropzone" id="drop">
        <h3>Drop photographs here</h3>
        <p>or click to browse &middot; JPG, PNG</p>
        <input id="files" type="file" accept="image/*" multiple class="hidden">
      </div>
      <div class="previews" id="previews"></div>

      <button class="btn" type="submit">Create &amp; share gallery</button>
    </form>

    <div class="notice hidden" id="result"></div>
  </main>

  <footer>&copy; <span id="year"></span> Atelier Photography</footer>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
